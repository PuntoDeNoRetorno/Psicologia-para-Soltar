name: Ingesta desde Telegram

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-cola
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Leer Telegram
        run: python bot/ingest.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar cola en el repo
        if: always()
        run: |
          git config user.name "bot-cola"
          git config user.email "bot-cola@users.noreply.github.com"
          git add -A data media
          git diff --cached --quiet && exit 0
          git commit -m "Ingesta $(date -u '+%F %H:%M')"
          git pull --rebase && git push
